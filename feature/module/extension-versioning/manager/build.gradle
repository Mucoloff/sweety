pluginManager.withPlugin('org.jetbrains.kotlin.jvm') {
    kotlin.sourceSets.configureEach {
        kotlin.srcDirs = []
    }
    tasks.named('jar') {
        setDependsOn(dependsOn.toList().findAll { it.toString() != 'compileKotlin' })
    }
}

dependencies {
    implementation project(':feature:module:extension:api')
    implementation project(':feature:module:extension:manager')
    implementation project(':feature:module:extension-versioning:api')
    implementation project(':feature:module:versioning:client')

    // Transitive deps exposed because upstream modules use 'implementation' (not 'api') scope
    implementation project(':util:logger')
    implementation project(':util:data')
    implementation project(':util:exception')
    implementation project(':feature:module:versioning:protocol')
    implementation project(':network:netty')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--enable-preview']
}

tasks.withType(Test).configureEach {
    jvmArgs '--enable-preview'
}
